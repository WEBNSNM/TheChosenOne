<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6efe8"/><stop offset="1" stop-color="#f7eee4"/></linearGradient></defs><rect width="1080" height="1440" fill="url(#b)"/><rect x="72" y="72" width="936" height="1296" rx="44" fill="#fffaf4" fill-opacity=".82" stroke="#587b6d" stroke-opacity=".25" stroke-width="3"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#3e302a"><text x="140" y="175" font-size="30" letter-spacing="6" fill="#668878">你会得到什么</text><text x="140" y="315" font-size="64" font-weight="800">一份能看懂、能行动的</text><text x="140" y="400" font-size="64" font-weight="800">个人成长洞察报告</text><g><rect x="140" y="520" width="800" height="130" rx="28" fill="#f4e2d3"/><text x="190" y="580" font-size="36" font-weight="700" fill="#874f3d">01  能力倾向</text><text x="190" y="625" font-size="25" fill="#765f54">看见你的优势、偏好与可练习方向</text></g><g><rect x="140" y="690" width="800" height="130" rx="28" fill="#e0eee6"/><text x="190" y="750" font-size="36" font-weight="700" fill="#527c69">02  阶段观察</text><text x="190" y="795" font-size="25" fill="#61786d">整理当前处境，拆出未来 30 天小步实验</text></g><g><rect x="140" y="860" width="800" height="130" rx="28" fill="#f0e8d5"/><text x="190" y="920" font-size="36" font-weight="700" fill="#896f3e">03  事业与金钱行动建议</text><text x="190" y="965" font-size="25" fill="#786d58">聚焦决策习惯、资源配置与风险意识</text></g><g><rect x="140" y="1030" width="800" height="130" rx="28" fill="#e7e1ef"/><text x="190" y="1090" font-size="36" font-weight="700" fill="#6b5a7f">04  风险与不确定性提示</text><text x="190" y="1135" font-size="25" fill="#70687b">不替代医疗、法律或投资专业建议</text></g><text x="140" y="1265" font-size="24" fill="#8d786d">职业 · 关注重点 · 目标 · 当前困难，是报告的主要依据</text><text x="140" y="1315" font-size="22" fill="#9b8175">传统历法文化信息仅作辅助参考</text></g></svg>
