<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e9dc"/><stop offset="1" stop-color="#dce9e2"/></linearGradient></defs><rect width="1080" height="1440" fill="url(#b)"/><rect x="72" y="72" width="936" height="1296" rx="44" fill="#fffaf4" fill-opacity=".86" stroke="#6b8b7b" stroke-opacity=".25" stroke-width="3"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#3e302a"><text x="140" y="175" font-size="30" letter-spacing="6" fill="#668878">下单后怎么用</text><text x="140" y="320" font-size="70" font-weight="800">三步开始整理</text><line x1="205" y1="475" x2="205" y2="1050" stroke="#8aa99a" stroke-width="6" stroke-dasharray="12 16"/><g><circle cx="205" cy="500" r="55" fill="#6d9283"/><text x="205" y="520" text-anchor="middle" font-size="44" font-weight="800" fill="#fffaf4">1</text><text x="320" y="490" font-size="40" font-weight="800">收到兑换码</text><text x="320" y="545" font-size="27" fill="#76675e">客服人工发码，输入后绑定当前浏览器</text></g><g><circle cx="205" cy="735" r="55" fill="#b9775b"/><text x="205" y="755" text-anchor="middle" font-size="44" font-weight="800" fill="#fffaf4">2</text><text x="320" y="725" font-size="40" font-weight="800">填写成长背景</text><text x="320" y="780" font-size="27" fill="#76675e">职业、关注重点、目标与当前困难</text></g><g><circle cx="205" cy="970" r="55" fill="#a58b57"/><text x="205" y="990" text-anchor="middle" font-size="44" font-weight="800" fill="#fffaf4">3</text><text x="320" y="960" font-size="40" font-weight="800">生成行动建议</text><text x="320" y="1015" font-size="27" fill="#76675e">生成个性化行动建议，按需复盘</text></g><rect x="140" y="1130" width="800" height="105" rx="30" fill="#6d9283"/><text x="540" y="1198" text-anchor="middle" font-size="34" font-weight="700" fill="#fffaf4">适合：职业选择 · 阶段复盘 · 决策整理</text><text x="140" y="1305" font-size="22" fill="#9b8175">内容用于自我观察与行动规划，不构成确定性预测</text></g></svg>
